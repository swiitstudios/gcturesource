<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | GCTU Resource</title>
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <style>
    :root {
      --primary-blue: #1a56db;
      --hero-bg: #cce3ff;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --bg-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Nav */
    header {
      background: #ffffff;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0d2538;
    }

    .logo-icon {
      background: var(--primary-blue);
      color: white;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 1rem;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--primary-blue);
    }

    .btn-upload {
      background: var(--primary-blue);
      color: white !important;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Hero 404 Section */
    main {
      flex: 1;
      background-color: var(--hero-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--primary-blue);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #0d2538;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-home {
      background: var(--primary-blue);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-home:hover {
      background: #1447b8;
    }

    /* Footer */
    footer {
      background: #ffffff;
      padding: 1.5rem;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <a href="/" class="logo">
      <span class="logo-icon">≡</span>
      GCTU Resource
    </a>
    <nav>
      <a href="/#departments">Departments</a>
      <a href="/#past-questions">Past Questions</a>
      <a href="/pages/about.html">About</a>
      <a href="/#upload" class="btn-upload">Upload</a>
    </nav>
  </header>

  <!-- Main 404 Hero Area -->
  <main>
    <div class="error-code">404</div>
    <h1>Slide Not Found</h1>
    <p>Looks like this slide or resource got moved, deleted, or never existed in the first place.</p>
    <div class="actions">
      <a href="/" class="btn-home">Back to Home Search</a>
    </div>
  </main>

  <!-- Footer with Sweet Studios attribution -->
  <footer>
    <p>© 2026 GCTU Resource. Created by <a href="https://sweetstudios.dev" target="_blank" rel="noopener noreferrer">Sweet Studios</a>.</p>
  </footer>

</body>
</html>
